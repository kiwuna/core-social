<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verification Required - Core</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #050505;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .challenge-container {
      background: #111111;
      border: 1px solid #333333;
      border-radius: 24px;
      padding: 48px;
      max-width: 480px;
      width: 100%;
      text-align: center;
    }

    .challenge-icon {
      font-size: 48px;
      margin-bottom: 24px;
    }

    .challenge-title {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
    }

    .challenge-subtitle {
      font-size: 15px;
      color: #737373;
      margin-bottom: 32px;
      line-height: 1.5;
    }

    .status-message {
      font-size: 14px;
      font-weight: 600;
      color: #d97706;
      margin-bottom: 24px;
      padding: 12px;
      background: rgba(217, 119, 6, 0.1);
      border-radius: 12px;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 24px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .challenge-action {
      display: inline-block;
      padding: 14px 32px;
      font-size: 14px;
      font-weight: 700;
      background: #ffffff;
      color: #050505;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .challenge-action:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(255, 255, 255, 0.15);
    }

    @media (max-width: 480px) {
      .challenge-container {
        padding: 32px 24px;
      }
    }
  </style>
</head>
<body>
  <div class="challenge-container">
    <div class="challenge-icon">🛡️</div>
    <h1 class="challenge-title">Verification Required</h1>
    <p class="challenge-subtitle">
      Cloudflare security is verifying your browser. This ensures your connection is secure and helps protect the network.
    </p>
    
    <div class="status-message">
      Please wait while we verify your browser...
    </div>
    
    <div class="spinner"></div>
    
    <button class="challenge-action" onclick="location.reload()">
      Refresh Verification
    </button>
  </div>
</body>
</html>
