<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Core — Feeds</title>
<link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>

  <main class="dashboard">
    <aside class="sidebar">
      <div id="userProfile" class="profile">
        <!-- Will be populated by JS -->
        <div class="avatar-stack">
          <div class="avatar avatar-art" aria-hidden="true">
            <span id="userEmojiLarge" style="font-size: 40px; display: flex; align-items: center; justify-content: center; height: 100%;">👻</span>
          </div>
        </div>
        <h2 id="userNameDisplay">Guest</h2>
        <p class="handle" id="userHandleDisplay">@anonymous</p>
        <button id="logoutBtn" class="logout-btn hidden">Log out</button>
        <a id="loginLink" href="login.html" class="primary-btn" style="display: block; margin-top: 10px; text-decoration: none; text-align: center; font-size: 14px;">Login</a>
      </div>

      <nav class="nav">
        <a class="nav-item active" href="#"><span class="ico">⌂</span> News Feed</a>
        <a class="nav-item" href="#"><span class="ico">🔔</span> Notifications <span class="badge">6</span></a>
        <a class="nav-item" href="#"><span class="ico">🛡</span> Clan</a>
        <a class="nav-item" href="#"><span class="ico">◉</span> Friends <span class="badge">3</span></a>
        <a class="nav-item" href="#"><span class="ico">⚙</span> Settings</a>
      </nav>
    </aside>

    <section class="feed">
      <header class="feed-head">
        <h1>Feeds</h1>
        <div class="tabs">
          <button class="tab">Recents</button>
          <button class="tab active">Friends</button>
          <button class="tab">Popular</button>
        </div>
      </header>

      <form id="postForm" class="composer" autocomplete="off">
        <span id="userEmojiMini" class="mini-avatar" style="font-size: 24px; display: flex; align-items: center; justify-content: center; background: #1c2432; border: 1px solid #273149;">👻</span>
        <input
          id="postInput"
          type="text"
          name="corePostInput"
          placeholder="Share something"
          maxlength="300"
          required
          autocomplete="off"
          autocorrect="off"
          autocapitalize="off"
          spellcheck="false"
        />
        <button type="button" class="emoji">◌</button>
        <input id="imageInput" type="file" accept="image/*" hidden />
        <div class="composer-row">
          <button type="button">⌗ File</button>
          <button id="pickImageButton" type="button">▦ Image</button>
          <button type="button">⌖ Location</button>
          <button type="button">◎ Public ▾</button>
          <button type="submit" class="send">Send</button>
        </div>
        <div id="imagePreviewBox" class="image-preview-box hidden">
          <img id="imagePreview" class="image-preview" alt="Selected preview" />
          <button id="removeImageButton" type="button" class="remove-image">Remove image</button>
        </div>
      </form>
      <p id="feedbackMessage" class="feedback-message" role="status" aria-live="polite"></p>

      <div id="postsList" class="posts-list"></div>
    </section>

    <aside class="News">
      <section>
        <h2>Stories</h2>
        <div class="stories">
          <div class="story">
            <img src="https://images.unsplash.com/photo-1473580044384-7ba9967e16a0?w=400&auto=format&fit=crop" alt="" />
            <div class="story-foot"><img src="https://i.pravatar.cc/40?img=20" alt=""/><span>Anatoly Pr…</span></div>
          </div>
          <div class="story">
            <img src="https://images.unsplash.com/photo-1454496522488-7a8e488e8606?w=400&auto=format&fit=crop" alt="" />
            <div class="story-foot"><img src="https://i.pravatar.cc/40?img=44" alt=""/><span>Lolita Earns</span></div>
          </div>
        </div>
      </section>

      <section>
        <h2>Trending</h2>
        <ul class="suggestions">
          <li><button>#AIart</button></li>
          <li><button>#Web3</button></li>
          <li><button>#Crypto</button></li>
        </ul>
        <a class="seeall" href="#">See all</a>
      </section>

    </aside>
  </main>

  <script src="./script.js"></script>
</body>
</html>
