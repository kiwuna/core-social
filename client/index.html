<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Core — Liquid</title>
<link rel="stylesheet" href="./style.css" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
  <main class="dashboard">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="logo-area">
        <h1>CORE</h1>
        <span>v1.1</span>
      </div>

      <nav class="nav">
        <a id="navFeed" class="nav-item active" href="#"><span class="ico">📰</span> <span>Feed</span></a>
        <a id="navSearch" class="nav-item" href="#"><span class="ico">🔍</span> <span>Search</span></a>
        <a id="navEvents" class="nav-item" href="#"><span class="ico">🎭</span> <span>Events</span></a>
        <a id="navNotifications" class="nav-item" href="#"><span class="ico">🔔</span> <span>Notifications</span></a>
        <a id="navProfile" class="nav-item" href="#">
          <span class="ico" id="userEmojiLarge">👤</span> 
          <div style="display: flex; flex-direction: column; line-height: 1.2;">
            <span id="userNameDisplay">Profile</span>
            <span id="userHandleDisplay" style="font-size: 11px; opacity: 0.5;">@anonymous</span>
          </div>
        </a>
      </nav>

      <div class="sidebar-footer">
        <a href="#" class="footer-link"><span class="ico">⭐</span> <span>CORE PRO</span></a>
        <a href="#" id="logoutBtn" class="footer-link hidden"><span class="ico">🚪</span> <span>Logout</span></a>
        <a href="login.html" id="loginLink" class="footer-link"><span class="ico">🔑</span> <span>Login</span></a>
      </div>
    </aside>

    <!-- Content Area -->
    <div id="contentArea" style="display: contents;">
      
      <!-- Main Feed -->
      <section id="feedView" class="feed">
        <div class="feed-tabs-container">
          <div class="tabs">
            <button class="tab active">For you</button>
            <button class="tab">Clans</button>
            <button class="tab">Following</button>
          </div>
        </div>

        <div id="postsList" class="feed-content" style="padding-bottom: 0;">
          <!-- Composer -->
          <form id="postForm" class="composer" autocomplete="off">
            <div class="composer-top">
               <span id="userEmojiMini" class="mini-avatar">👻</span>
               <input
                 id="postInput"
                 type="text"
                 placeholder="What's on your mind?"
                 maxlength="300"
                 required
                 autocomplete="off"
               />
            </div>
            
            <div class="composer-bottom">
              <div class="composer-tools">
                <span id="pickImageButton">📎</span>
                <span>😊</span>
                <span>🎨</span>
                <span>📊</span>
              </div>
              <input id="imageInput" type="file" accept="image/*" hidden />
              <button type="submit" class="send">Post</button>
            </div>

            <div id="imagePreviewBox" class="image-preview-box hidden" style="margin-top: 15px;">
              <img id="imagePreview" alt="Preview" style="max-width: 100px; border-radius: 12px;" />
              <button id="removeImageButton" type="button" style="background: none; border: 0; color: #888; cursor: pointer;">Remove</button>
            </div>
          </form>

          <p id="feedbackMessage" class="feedback-message" role="status" aria-live="polite"></p>
        </div>

        <!-- Feed Posts Container -->
        <div id="feedPosts" class="feed-content" style="padding-top: 0; flex: 1; min-height: 0;"></div>
      </section>

      <!-- Profile View -->
      <section id="profileView" class="feed hidden">
        <div id="profileContent" class="feed-content" style="padding: 0; overflow-x: hidden;">
          <!-- Profile header and posts injected here -->
        </div>
      </section>

    </div>

    <!-- Right Rail -->
    <aside class="News">
      <div class="info-links">
        <ul>
          <li>Server Status</li>
          <li>Terms of Service</li>
          <li>Privacy Policy</li>
          <li>Cookie Policy</li>
        </ul>
      </div>
      <div class="copyright">
        © 2026 CORE Social
      </div>
    </aside>
  </main>

  <!-- Image Expansion Modal -->
  <div id="imageModal" class="image-modal">
    <div class="modal-close" id="modalClose">&times;</div>
    <div class="modal-content">
      <img id="modalImage" alt="Expanded View" />
    </div>
  </div>

  <script src="./script.js"></script>
</body>
</html>
