<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Core - Login</title>
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body.auth-page {
            background: #050505;
            position: relative;
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
        }

        body.auth-page::before,
        body.auth-page::after {
            content: '';
            position: absolute;
            width: clamp(320px, 45vw, 550px);
            height: clamp(320px, 45vw, 550px);
            filter: blur(130px);
            z-index: 0;
            opacity: 0.22;
            pointer-events: none;
        }

        body.auth-page::before {
            background: radial-gradient(circle, var(--accent, #fff) 0%, transparent 75%);
            top: -10%;
            left: -10%;
            animation: fluidBlobMoveOne 22s infinite ease-in-out;
        }

        body.auth-page::after {
            background: radial-gradient(circle, #444444 0%, transparent 70%);
            bottom: -10%;
            right: -10%;
            animation: fluidBlobMoveTwo 26s infinite ease-in-out;
        }

        @keyframes fluidBlobMoveOne {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); border-radius: 50%; }
            33% { transform: translate(120px, 60px) scale(1.3) rotate(120deg); border-radius: 42% 58% 70% 30% / 45% 45% 55% 55%; }
            66% { transform: translate(-60px, 140px) scale(0.85) rotate(240deg); border-radius: 70% 30% 52% 48% / 60% 40% 60% 40%; }
            100% { transform: translate(0, 0) scale(1) rotate(360deg); border-radius: 50%; }
        }

        @keyframes fluidBlobMoveTwo {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); border-radius: 50%; }
            33% { transform: translate(-100px, -80px) scale(1.25) rotate(-120deg); border-radius: 55% 45% 30% 70% / 50% 60% 40% 50%; }
            66% { transform: translate(80px, -120px) scale(0.9) rotate(-240deg); border-radius: 40% 60% 60% 40% / 40% 40% 60% 60%; }
            100% { transform: translate(0, 0) scale(1) rotate(-360deg); border-radius: 50%; }
        }

        .auth-container {
            background: rgba(12, 12, 12, 0.4) !important;
            backdrop-filter: blur(35px) !important;
            -webkit-backdrop-filter: blur(35px) !important;
            border: 1px solid rgba(255, 255, 255, 0.05) !important;
            box-shadow: 0 40px 120px rgba(0, 0, 0, 0.95), inset 0 1px 0px rgba(255, 255, 255, 0.08) !important;
            border-radius: var(--radius-xl, 24px) !important;
            width: 440px;
            height: 560px;
            padding: 45px 40px;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            z-index: 2;
        }

        header {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            margin-bottom: 32px;
        }

        header .logo.backronym {
            font-family: 'Outfit', sans-serif;
            font-size: 38px;
            font-weight: 800;
            letter-spacing: -0.5px;
            display: inline-flex;
            justify-content: center;
            align-items: baseline;
            cursor: default;
            background: linear-gradient(180deg, #ffffff 0%, #b3b3b3 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            width: 100%;
        }

        .backronym .letter {
            display: inline-flex;
            align-items: baseline;
            white-space: nowrap;
            margin-right: 0px;
            transition: margin 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .backronym .expanded-text {
            max-width: 0;
            opacity: 0;
            font-size: 24px;
            text-transform: lowercase;
            font-weight: 500;
            letter-spacing: -0.5px;
            overflow: hidden;
            display: inline-block;
            vertical-align: baseline;
            transition: max-width 0.6s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.4s ease;
        }

        .backronym .letter.active .expanded-text {
            max-width: 110px;
            opacity: 0.8;
        }

        .backronym .letter.active {
            margin-right: 12px;
        }

        header .subtitle {
            font-size: 14px;
            color: var(--muted, #737373);
            font-weight: 500;
            letter-spacing: -0.01em;
            margin-top: 8px;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .auth-form .form-group label {
            font-size: 11px;
            font-weight: 700;
            color: var(--muted, #737373);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 8px;
            display: block;
        }

        /* wrapper for relative layout positioning of view pass toggle */
        .input-wrapper {
            position: relative;
            width: 100%;
        }

        .auth-form input[type="text"],
        .auth-form input[type="password"] {
            background: rgba(255, 255, 255, 0.01) !important;
            border: 1px solid rgba(255, 255, 255, 0.04) !important;
            border-radius: var(--radius-md, 12px) !important;
            padding: 15px 18px !important;
            font-size: 15px !important;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1) !important;
            width: 100%;
            color: #fff !important;
            outline: none;
        }

        /* nuclear kill on native yellow browser autofill colors */
        .auth-form input:-webkit-autofill,
        .auth-form input:-webkit-autofill:hover, 
        .auth-form input:-webkit-autofill:focus {
            -webkit-text-fill-color: #ffffff !important;
            -webkit-box-shadow: 0 0 0px 1000px #0c0c0c inset !important;
            box-shadow: 0 0 0px 1000px #0c0c0c inset !important;
            transition: background-color 5000s ease-in-out 0s !important;
        }

        .auth-form input::placeholder { color: rgba(255, 255, 255, 0.15); }
        .auth-form input:focus {
            background: rgba(255, 255, 255, 0.03) !important;
            border-color: rgba(255, 255, 255, 0.2) !important;
        }

        /* clean minimalist toggle layout engine */
        .password-toggle {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #525252;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
            transition: color 0.2s ease;
        }

        .password-toggle:hover {
            color: #a3a3a3;
        }

        .password-toggle svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .primary-btn {
            background: var(--accent, #fff) !important;
            color: var(--bg, #050505) !important;
            border-radius: var(--radius-md, 12px) !important;
            padding: 16px !important;
            font-size: 15px !important;
            font-weight: 700;
            border: none;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1) !important;
            width: 100%;
            margin-top: 8px;
        }

        .primary-btn:hover {
            transform: translateY(-1.5px) !important;
            box-shadow: 0 15px 35px rgba(255, 255, 255, 0.12) !important;
            background: #f0f0f0 !important;
        }

        .auth-footer {
            margin-top: 24px;
            width: 100%;
            text-align: center;
            font-size: 14px;
            color: var(--muted, #737373);
        }

        .auth-footer a { color: #fff; font-weight: 700; text-decoration: none; }
        .auth-footer a:hover { text-decoration: underline; }

        #feedback-container { margin-top: 16px; width: 100%; }
        .feedback-message { font-family: inherit; border-radius: 100px; font-size: 13px; text-align: center; }
    </style>
</head>
<body class="auth-page">
    <div class="auth-container">
        <header>
            <h1 class="logo backronym">
                <span class="letter">C<span class="expanded-text">onnect</span></span>
                <span class="letter">O<span class="expanded-text">nRender</span></span>
                <span class="letter">R<span class="expanded-text">eality</span></span>
                <span class="letter">E<span class="expanded-text">ncrypt</span></span>
            </h1>
            <p class="subtitle">Welcome back.</p>
        </header>

        <form id="login-form" class="auth-form">
            <div class="form-group">
                <label for="username">Handle</label>
                <div class="input-wrapper">
                    <input type="text" id="username" placeholder="Enter username..." required autofocus>
                </div>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <input type="password" id="password" placeholder="Enter password..." required>
                    <button type="button" class="password-toggle" id="toggle-password-btn" aria-label="Toggle password visibility">
                        <svg id="eye-icon" viewBox="0 0 24 24">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="primary-btn" id="submit-btn">Authorize</button>

            <footer class="auth-footer">
                <p>New identity? <a href="signup.html">Register</a></p>
            </footer>
            
            <div id="feedback-container"></div>
        </form>
    </div>

    <script>
        const feedbackContainer = document.getElementById('feedback-container');
        const letters = document.querySelectorAll('.backronym .letter');
        const passwordInput = document.getElementById('password');
        const togglePasswordBtn = document.getElementById('toggle-password-btn');
        const eyeIcon = document.getElementById('eye-icon');
        let currentIndex = 0;

        // native visibility swap controller logic
        togglePasswordBtn.addEventListener('click', () => {
            const isPassword = passwordInput.getAttribute('type') === 'password';
            passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
            
            // updates the eye path engine smoothly when active
            if (isPassword) {
                eyeIcon.innerHTML = `
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                    <line x1="1" y1="1" x2="23" y2="23"></line>
                `;
            } else {
                eyeIcon.innerHTML = `
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                `;
            }
        });

        function runSlideshow() {
            letters.forEach(l => l.classList.remove('active'));
            currentIndex = (currentIndex + 1) % letters.length;
            setTimeout(() => {
                letters[currentIndex].classList.add('active');
            }, 600); 
        }

        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                letters[0].classList.add('active');
                setInterval(runSlideshow, 2800);
            }, 1500);
        });

        function showFeedback(message, type = 'success') {
            feedbackContainer.innerHTML = '';
            const feedback = document.createElement('div');
            feedback.className = `feedback-message ${type} show`;
            feedback.textContent = message;
            feedbackContainer.appendChild(feedback);
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const submitBtn = document.getElementById('submit-btn');

            submitBtn.disabled = true;
            submitBtn.textContent = 'Verifying...';

            try {
                const res = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (res.ok) {
                    showFeedback('Access granted.');
                    setTimeout(() => window.location.href = '/', 1000);
                } else {
                    showFeedback(data.error || 'Invalid credentials', 'error');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Authorize';
                }
            } catch (err) {
                showFeedback('Database offline.', 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Authorize';
            }
        });
    </script>
</body>
</html>
