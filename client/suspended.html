<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Suspended | Core</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050505;
      --panel: rgba(18, 18, 18, 0.95);
      --panel-border: rgba(255, 255, 255, 0.08);
      --text: #eaeaea;
      --muted: #888888;
      --accent: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at center, #111111 0%, #050505 100%);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .suspension-card {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 28px;
      width: 100%;
      max-width: 420px;
      padding: 48px 36px;
      text-align: center;
      box-shadow: 0 40px 80px rgba(0, 0, 0, 0.8);
      position: relative;
      overflow: hidden;
    }

    .suspension-card::before {
      content: '';
      position: absolute;
      top: 0; left: 24px; right: 24px; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(239, 68, 68, 0.4), transparent);
    }

    .badge-icon {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: rgba(239, 68, 68, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      border: 1px solid rgba(239, 68, 68, 0.15);
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.05);
    }

    h1 {
      font-size: 26px;
      font-weight: 300;
      letter-spacing: -0.5px;
      margin-bottom: 12px;
      color: #fff;
    }

    p.description {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 32px;
      font-weight: 400;
    }

    .time-grid {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 32px 0;
    }

    .time-box {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 12px;
      padding: 12px 10px;
      width: 72px;
      text-align: center;
    }

    .time-val {
      font-family: 'JetBrains Mono', monospace;
      font-size: 22px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.5px;
    }

    .time-lbl {
      font-size: 8px;
      font-weight: 800;
      color: var(--muted);
      letter-spacing: 1px;
      margin-top: 4px;
      text-transform: uppercase;
    }

    .btn-action {
      display: inline-block;
      width: 100%;
      background: #fff;
      color: #000;
      border: 0;
      padding: 14px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
      box-shadow: 0 4px 12px rgba(255, 255, 255, 0.1);
    }

    .btn-action:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(255, 255, 255, 0.15);
    }
  </style>
</head>
<body>

  <div class="suspension-card">
    <div class="badge-icon">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
    </div>
    
    <div style="font-size: 11px; font-weight: 800; color: #ef4444; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px;">Access Restricted</div>
    <h1>Account Suspended</h1>
    <p class="description">Your account has been suspended due to community guidelines violations or warnings.</p>
    
    <!-- Countdown Grid -->
    <div id="countdown-grid" class="time-grid">
      <div class="time-box">
        <div id="days-val" class="time-val">00</div>
        <div class="time-lbl">Days</div>
      </div>
      <div class="time-box">
        <div id="hours-val" class="time-val">00</div>
        <div class="time-lbl">Hours</div>
      </div>
      <div class="time-box">
        <div id="minutes-val" class="time-val">00</div>
        <div class="time-lbl">Mins</div>
      </div>
      <div class="time-box">
        <div id="seconds-val" class="time-val" style="color: #ef4444;">00</div>
        <div class="time-lbl" style="color: rgba(239, 68, 68, 0.65);">Secs</div>
      </div>
    </div>

    <!-- Permanent restriction card -->
    <div id="permanent-banner" style="display: none; background: rgba(239, 68, 68, 0.04); border: 1px solid rgba(239, 68, 68, 0.15); border-radius: 16px; padding: 20px; margin: 32px 0;">
      <div style="font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px; color: #ef4444; margin-bottom: 4px;">Restriction Type</div>
      <div style="font-size: 15px; font-weight: 700; color: #fff; letter-spacing: -0.2px;">Indefinite / Permanent Suspension</div>
    </div>

    <button onclick="logoutAndRedirect()" class="btn-action">Return to Login</button>
  </div>

  <script>
    // Parse the suspended_until ISO timestamp from URL params
    const params = new URLSearchParams(window.location.search);
    const untilParam = params.get("until");

    function updateCountdown() {
      const gridEl = document.getElementById("countdown-grid");
      const permEl = document.getElementById("permanent-banner");

      if (!untilParam) {
        gridEl.style.display = "none";
        permEl.style.display = "block";
        return;
      }

      const targetDate = new Date(untilParam);
      
      // Check if permanent (year >= 9000)
      if (targetDate.getFullYear() >= 9000) {
        gridEl.style.display = "none";
        permEl.style.display = "block";
        return;
      }

      const now = new Date();
      const diffMs = targetDate - now;

      if (diffMs <= 0) {
        gridEl.style.display = "none";
        permEl.style.display = "block";
        permEl.innerHTML = `
          <div style="font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px; color: #10b981; margin-bottom: 4px;">Status</div>
          <div style="font-size: 15px; font-weight: 700; color: #fff; letter-spacing: -0.2px;">Suspension Lifted</div>
        `;
        permEl.style.borderColor = "rgba(16, 185, 129, 0.3)";
        permEl.style.background = "rgba(16, 185, 129, 0.04)";
        return;
      }

      gridEl.style.display = "flex";
      permEl.style.display = "none";

      const days = Math.floor(diffMs / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diffMs % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((diffMs % (1000 * 60)) / 1000);

      document.getElementById("days-val").textContent = days.toString().padStart(2, '0');
      document.getElementById("hours-val").textContent = hours.toString().padStart(2, '0');
      document.getElementById("minutes-val").textContent = minutes.toString().padStart(2, '0');
      document.getElementById("seconds-val").textContent = seconds.toString().padStart(2, '0');
    }

    // Run tick immediately and schedule subsequent ticks
    updateCountdown();
    setInterval(updateCountdown, 1000);

    async function logoutAndRedirect() {
      try {
        await fetch("/auth/logout", { method: "POST" });
      } catch (err) {
        // Suppress network errors
      }
      window.location.href = "/login.html";
    }
  </script>
</body>
</html>
