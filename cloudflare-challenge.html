<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verification Required - Cloudflare Security Challenge</title>
  <meta name="description" content="Security verification required to access this content">
  <meta name="robots" content="noindex, nofollow">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #050505;
      --panel: #111111;
      --text: #f5f5f5;
      --muted: #737373;
      --accent: #ffffff;
      --radius-xl: 28px;
      --radius-lg: 20px;
      --radius-md: 14px;
      --border: rgba(255, 255, 255, 0.06);
    }

    html, body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: var(--text);
      background: var(--bg);
      min-height: 100vh;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow: hidden;
      -webkit-text-size-adjust: 100%;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .challenge-container {
      width: 100%;
      max-width: 520px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 48px;
      text-align: center;
      animation: fadeIn 0.5s ease;
    }

    .challenge-header {
      margin-bottom: 32px;
    }

    .challenge-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
    }

    .challenge-title {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
    }

    .challenge-subtitle {
      color: var(--muted);
      font-size: 15px;
      font-weight: 500;
      line-height: 1.5;
    }

    .spinner-container {
      margin: 32px auto;
      width: 48px;
      height: 48px;
      position: relative;
    }

    .spinner {
      width: 100%;
      height: 100%;
      position: relative;
      transform: translateZ(0);
    }

    .spinner::before,
    .spinner::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px solid var(--accent);
    }

    .spinner::before {
      animation: spin 1.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      border-color: transparent #ffffff #ffffff #ffffff;
    }

    .spinner::after {
      animation: spin 1s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      border-color: transparent #ffffff #ffffff #ffffff;
      opacity: 0.6;
    }

    .status-message {
      font-size: 14px;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 32px;
      min-height: 20px;
    }

    .status-message.loading {
      color: var(--muted);
    }

    .cloudflare-logo {
      margin-top: 24px;
      font-size: 11px;
      color: var(--muted);
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    .cloudflare-logo a {
      color: var(--muted);
      text-decoration: none;
    }

    .cloudflare-logo a:hover {
      color: var(--accent);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @media (max-width: 600px) {
      .challenge-container {
        padding: 32px 24px;
      }
      .challenge-title { font-size: 20px; }
      .challenge-subtitle { font-size: 14px; }
      .spinner-container { margin: 24px auto; }
    }
  </style>
</head>
<body>
  <div class="challenge-container" id="challengeContainer">
    <div class="challenge-header">
      <div class="challenge-icon">🔒</div>
      <h1 class="challenge-title" id="challengeTitle">Verification Required</h1>
      <p class="challenge-subtitle" id="challengeSubtitle">
        We need to verify you're human before showing you this content. This helps keep our community secure.
      </p>
    </div>

    <div class="spinner-container">
      <div class="spinner" id="spinner"></div>
    </div>

    <p class="status-message loading" id="status">Checking your browser...</p>

    <div class="cloudflare-logo">
      <span>Protected by Cloudflare</span>
    </div>
  </div>

  <script>
    /**
     * Cloudflare Security Challenge Implementation
     * 
     * This page is served when Cloudflare's security features trigger.
     * The verification flow works as follows:
     * 
     * 1. User visits protected page
     * 2. Cloudflare intercepts and shows this challenge page
     * 3. This script runs verification checks (browser fingerprinting, etc.)
     * 4. Upon successful verification, Cloudflare redirects to original URL
     * 
     * In production, Cloudflare handles the actual verification.
     * This implementation provides a fallback if directly accessed.
     */

    (function() {
      'use strict';
      
      const statusEl = document.getElementById('status');
      const spinner = document.getElementById('spinner');
      const container = document.getElementById('challengeContainer');
      
      let verificationComplete = false;
      
      // Verify Cloudflare is protecting us
      function verifyCloudflareProtection() {
        // Cloudflare sets specific headers and cookies
        // In production, Cloudflare handles this automatically
        
        // Check for Cloudflare-specific markers
        const cfMarkers = [
          'cf-ray',
          'cf-cache-status',
          'cf-worker'
        ];
        
        return cfMarkers.some(marker => 
          document.cookie.includes(marker) || 
          localStorage.getItem(marker) === 'true'
        );
      }
      
      // Perform client-side checks (simulating Cloudflare's verification)
      function performVerificationChecks() {
        return new Promise((resolve) => {
          const checks = [];
          
          // Check 1: Browser capabilities
          checks.push(!!window.addEventListener);
          
          // Check 2: Canvas support (for fingerprinting)
          checks.push(!!document.createElement('canvas').getContext);
          
          // Check 3: Web Crypto API
          checks.push(!!window.crypto || !!window.msCrypto);
          
          // Check 4: No automated behavior patterns
          const startTime = Date.now();
          const endTime = Date.now();
          checks.push((endTime - startTime) < 100); // Human reaction time check simulation
          
          // Check 5: Mouse movement (if applicable)
          let mouseMoved = false;
          const mouseHandler = () => { mouseMoved = true; };
          document.addEventListener('mousemove', mouseHandler, { once: true });
          
          setTimeout(() => {
            checks.push(mouseMoved || true); // Always pass for non-interactive verification
            resolve(checks.every(check => check === true));
          }, 500);
        });
      }
      
      // Complete verification
      async function completeVerification() {
        if (verificationComplete) return;
        verificationComplete = true;
        
        // Stop spinner
        spinner.style.display = 'none';
        
        // Update status
        statusEl.textContent = 'Verification complete! Redirecting...';
        statusEl.classList.remove('loading');
        
        // Perform verification
        try {
          const verified = await performVerificationChecks();
          
          if (verified) {
            // Set verification cookie
            const expiry = new Date();
            expiry.setTime(expiry.getTime() + 300000); // 5 minutes
            
            document.cookie = `cloudflare_verified=true; expires=${expiry.toUTCString()}; path=/; SameSite=Lax`;
            
            // Notify parent frame (if in iframe)
            try {
              window.parent.postMessage('cloudflare-verify-complete', '*');
            } catch (e) {
              // Ignore cross-origin errors
            }
            
            // Simulate redirect (in production, Cloudflare handles this)
            setTimeout(function() {
              console.log('Security verification completed successfully');
              
              // Check if we're in a Cloudflare worker context
              if (typeof Cloudflare !== 'undefined' && Cloudflare.request) {
                // Cloudflare Worker context - redirect using Cloudflare API
                // In production, Cloudflare automatically redirects after challenge
              } else {
                // Standalone mode - redirect to home
                // Uncomment the next line if you want auto-redirect
                // window.location.href = '/';
              }
            }, 1500);
          } else {
            statusEl.textContent = 'Verification failed. Please try again.';
            setTimeout(() => {
              window.location.reload();
            }, 2000);
          }
        } catch (err) {
          console.error('Verification error:', err);
          statusEl.textContent = 'Verification error. Please try again.';
          setTimeout(() => {
            window.location.reload();
          }, 2000);
        }
      }
      
      // Auto-complete verification after a delay (simulating Cloudflare's behavior)
      // In production, Cloudflare handles this instantly
      setTimeout(function() {
        completeVerification();
      }, 2000);
      
      // Allow manual refresh to clear challenge state
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('clear_challenge') === '1') {
        localStorage.removeItem('cloudflare_challenge_completed');
        document.cookie = 'cloudflare_verified=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
        window.location.reload();
      }
    })();
  </script>
</body>
</html>
